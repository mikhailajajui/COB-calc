# Azure Pipelines for the COB calculator (COB-ts, Canada).
#
# Build stage (always runs): Node 26.13.0 (.nvmrc; .npmrc sets engine-strict, so an older
# Node stops npm ci with EBADENGINE), then typecheck, test and build. It packages only
# ui/, dist/ and package.json, as docs/DEPLOY-AZURE.md "What to deploy" asks.
#
# Deploy stage (off by default): zip-deploys that package to a Linux App Service running
# NODE|24-lts with the startup command `node ui/serve.mjs` and the platform build turned off.
# It is left out of the run at compile time unless the `deploy` parameter is true, so the
# pipeline runs before any Azure service connection exists. To turn it on:
#   1. Create an Azure Resource Manager service connection in the DevOps project.
#   2. Set azureServiceConnection and webAppName below.
#   3. Queue a run with "Deploy to Azure App Service" ticked, or change the default to true.

trigger:
  branches:
    include:
      - deploy

pr: none

parameters:
  - name: deploy
    displayName: Deploy to Azure App Service
    type: boolean
    default: false

variables:
  nodeVersion: '26.13.0'
  azureServiceConnection: '<service-connection-name>'
  webAppName: '<app-service-name>'

stages:
  - stage: Build
    jobs:
      - job: Build
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UseNode@1
            displayName: Use Node $(nodeVersion)
            inputs:
              version: $(nodeVersion)

          - script: npm ci
            displayName: npm ci

          - script: npm run typecheck
            displayName: Typecheck

          - script: npm test
            displayName: Test

          - script: npm run build
            displayName: Build (src/ -> dist/)

          - script: |
              set -euo pipefail
              mkdir -p "$(Build.ArtifactStagingDirectory)/app"
              cp -R ui dist package.json "$(Build.ArtifactStagingDirectory)/app/"
            displayName: Stage ui/, dist/ and package.json

          - task: ArchiveFiles@2
            displayName: Zip the app
            inputs:
              rootFolderOrFile: $(Build.ArtifactStagingDirectory)/app
              includeRootFolder: false
              archiveType: zip
              archiveFile: $(Build.ArtifactStagingDirectory)/cob-calculator.zip

          - task: PublishPipelineArtifact@1
            displayName: Publish the app artifact
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/cob-calculator.zip
              artifact: cob-calculator

  - ${{ if eq(parameters.deploy, true) }}:
      - stage: Deploy
        dependsOn: Build
        condition: succeeded()
        jobs:
          - deployment: Deploy
            pool:
              vmImage: ubuntu-latest
            environment: cob-calculator
            strategy:
              runOnce:
                deploy:
                  steps:
                    - task: AzureWebApp@1
                      displayName: Deploy to App Service
                      inputs:
                        azureSubscription: $(azureServiceConnection)
                        appType: webAppLinux
                        appName: $(webAppName)
                        package: $(Pipeline.Workspace)/cob-calculator/cob-calculator.zip
                        runtimeStack: 'NODE|24-lts'
                        startUpCommand: node ui/serve.mjs
                        appSettings: -SCM_DO_BUILD_DURING_DEPLOYMENT false
