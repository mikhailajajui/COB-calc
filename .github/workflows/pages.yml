name: Deploy COB Calculator site to GitHub Pages

# Publishes a single site with three sections:
#   /        - site/index.html: the portal linking to all three variants
#   /ts/     - the COB-ts Canadian COB calculator (ui/ca.html, built from source)
#   /ts/us/  - the legacy US-style worksheet (ui/index.html)
#   /excel/  - the COB-xlsx manual (index.html) + COB_Calculator_CA.xlsx and the
#              legacy COB_Calculator.xlsx downloads
#
# The Python/Streamlit app (COB-py/) is NOT built here -- it's deployed
# separately via Streamlit Community Cloud (share.streamlit.io), which watches
# this repo directly. See site/index.html's STREAMLIT_URL for wiring the link
# once that's deployed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build & test COB-ts
        working-directory: COB-ts
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Assemble the site
        run: |
          mkdir -p _site/ts/dist _site/ts/us _site/excel

          # --- root: the portal page ---
          cp site/index.html _site/index.html

          # --- /ts/: the Canadian COB calculator; /ts/us/: the legacy US worksheet ---
          # The ui/ pages reference /ui/*.js and /dist/index.js as domain-root-absolute
          # paths, which is correct for the local dev server (ui/serve.mjs serves the
          # whole project root at "/") but breaks under a GitHub Pages *project*
          # site's /ts/ subpath. Rewrite those references (and the cross-links between
          # the two pages) to relative paths -- the source files under COB-ts/ui/ are
          # left untouched so local dev keeps working exactly as before.
          cp COB-ts/ui/ca.html _site/ts/index.html
          cp COB-ts/ui/ca.js _site/ts/ca.js
          cp COB-ts/ui/index.html _site/ts/us/index.html
          cp COB-ts/ui/main.js _site/ts/us/main.js
          # Recursive: the Canadian engine is built into dist/ca/, which dist/index.js imports.
          cp -R COB-ts/dist/. _site/ts/dist/
          sed -i 's#/ui/ca.js#ca.js#' _site/ts/index.html
          sed -i "s#/dist/index.js#./dist/index.js#" _site/ts/ca.js
          # The printout reads the engine version from package.json at runtime.
          cp COB-ts/package.json _site/ts/package.json
          sed -i "s#fetch('/package.json')#fetch('package.json')#" _site/ts/ca.js
          sed -i 's#/ui/main.js#main.js#; s#/ui/ca.html#../#' _site/ts/us/index.html
          sed -i "s#/dist/index.js#../dist/index.js#" _site/ts/us/main.js

          # --- /excel/: the manual + the downloadable workbooks ---
          cp COB-xlsx/index.html _site/excel/index.html
          cp COB-xlsx/COB_Calculator_CA.xlsx _site/excel/COB_Calculator_CA.xlsx
          cp COB-xlsx/COB_Calculator.xlsx _site/excel/COB_Calculator.xlsx

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
