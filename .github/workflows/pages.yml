name: Deploy COB Calculator site to GitHub Pages

# Publishes a single site with three sections:
#   /        - site/index.html: the portal linking to all three variants
#   /ts/     - the COB-ts web calculator (built from source)
#   /excel/  - the COB-xlsx manual (index.html) + a COB_Calculator.xlsx download
#
# The Python/Streamlit app (COB-py/) is NOT built here -- it's deployed
# separately via Streamlit Community Cloud (share.streamlit.io), which watches
# this repo directly. See site/index.html's STREAMLIT_URL for wiring the link
# once that's deployed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build & test COB-ts
        working-directory: COB-ts
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Assemble the site
        run: |
          mkdir -p _site/ts/dist _site/excel

          # --- root: the portal page ---
          cp site/index.html _site/index.html

          # --- /ts/: the web calculator ---
          # ui/index.html and ui/main.js reference /ui/main.js and /dist/index.js as
          # domain-root-absolute paths, which is correct for the local dev server
          # (ui/serve.mjs serves the whole project root at "/") but breaks under a
          # GitHub Pages *project* site's /ts/ subpath. Rewrite just those two
          # references to relative paths -- the source files under COB-ts/ui/ are
          # left untouched so local dev keeps working exactly as before.
          cp COB-ts/ui/index.html _site/ts/index.html
          cp COB-ts/ui/main.js _site/ts/main.js
          cp COB-ts/dist/*.js COB-ts/dist/*.d.ts _site/ts/dist/ 2>/dev/null || cp COB-ts/dist/*.js _site/ts/dist/
          sed -i 's#/ui/main.js#main.js#' _site/ts/index.html
          sed -i "s#/dist/index.js#./dist/index.js#" _site/ts/main.js

          # --- /excel/: the manual + the downloadable workbook ---
          cp COB-xlsx/index.html _site/excel/index.html
          cp COB-xlsx/COB_Calculator.xlsx _site/excel/COB_Calculator.xlsx

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
